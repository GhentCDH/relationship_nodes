name: Tests

on:
  push:
  pull_request:
  # Weekly, to notice breaking changes in dependencies such as
  # elasticsearch_connector.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    name: Drupal ${{ matrix.drupal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: '^10.3'
            # Drupal 10's WebDriver test driver fails clicks with current
            # chromedriver (HTTP 400), so the browser tests and PHPStan run
            # on Drupal 11.
            extras: false
          - drupal: '^11'
            extras: true
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 >/dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd
          tools: composer:v2
          coverage: none
      - name: Start chromedriver
        if: matrix.extras
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 > /tmp/chromedriver.log 2>&1 &
          echo 'MINK_DRIVER_ARGS_WEBDRIVER=["chrome", {"browserName":"chrome","goog:chromeOptions":{"w3c":true,"args":["--headless=new","--no-sandbox","--disable-dev-shm-usage","--window-size=1280,1024"]}}, "http://localhost:9515"]' >> "$GITHUB_ENV"
          echo 'RN_PHPSTAN=1' >> "$GITHUB_ENV"
      - name: Build and test
        env:
          DRUPAL_CORE: ${{ matrix.drupal }}
          RN_ELASTICSEARCH_URL: http://localhost:9200
          SIMPLETEST_BASE_URL: http://localhost:8080
        run: .github/run-tests.sh
