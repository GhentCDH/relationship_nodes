name: 'Relationship Nodes Search'
type: module
description: 'Indexes, filters and facets relationship_nodes relations in Elasticsearch, via Search API and Views. Requires the Elasticsearch Connector; other Search API backends are not supported.'
package: 'Relationship Nodes'
core_version_requirement: ^10.3 || ^11.2
dependencies:
  - search_api:search_api
  - elasticsearch_connector:elasticsearch_connector
  - facets:facets_exposed_filters
  - better_exposed_filters:better_exposed_filters
  - relationship_nodes:relationship_nodes
